name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      heavy: ${{ steps.filter.outputs.heavy }}
      ci_policy: ${{ steps.policy.outputs.ci_policy }}
      full_verification: ${{ steps.filter.outputs.heavy == 'true' || steps.policy.outputs.ci_policy == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Detect relevant changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        with:
          predicate-quantifier: some-with-excludes
          filters: .github/file-filters.yml
      - name: Detect CI policy changes
        id: policy
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        with:
          filters: |
            ci_policy:
              - '.github/file-filters.yml'
              - '.github/workflows/**'
              - '.github/actions/**'

  actionlint:
    name: Actionlint
    needs: changes
    if: needs.changes.outputs.ci_policy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Lint GitHub Actions workflows
        uses: reviewdog/action-actionlint@2085657ab2c7f48c58edcc767fba576f63bea76b
        with:
          actionlint_flags: -pyflakes=
          fail_level: error
          reporter: github-annotations

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.full_verification == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024
        with:
          cache: true
          require-lockfile: true
      - name: Check lint
        run: pnpm lint:check

  format:
    name: Format & Manifests
    needs: changes
    if: needs.changes.outputs.full_verification == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024
        with:
          cache: true
          require-lockfile: true
      - name: Check formatting
        run: pnpm format:check
      - name: Check package.json ordering
        run: pnpm sort-package-json:check

  test:
    name: Test & Coverage
    needs: changes
    if: needs.changes.outputs.full_verification == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024
        with:
          cache: true
          require-lockfile: true
      - name: Run tests with coverage
        run: pnpm test:coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5
        with:
          disable_search: true
          fail_ci_if_error: false
          files: packages/eslint-config-yarapa/coverage/lcov.info,packages/prettier-config-yarapa/coverage/lcov.info,packages/commitlint-config-yarapa/coverage/lcov.info

  check-types:
    name: Type Check
    needs: changes
    if: needs.changes.outputs.full_verification == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024
        with:
          cache: true
          require-lockfile: true
      - name: Check types
        run: pnpm typecheck

  knip:
    name: Knip
    needs: changes
    if: needs.changes.outputs.full_verification == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024
        with:
          cache: true
          require-lockfile: true
      - name: Run Knip
        run: pnpm knip

  package-validation:
    name: Package Validation
    needs: changes
    if: needs.changes.outputs.full_verification == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024
        with:
          cache: true
          require-lockfile: true
      - name: Build packages
        run: pnpm build
      - name: Validate peer dependency contracts
        run: pnpm peers:check
      - name: Validate package manifests and files
        run: pnpm check:publint
      - name: Validate package type resolution
        run: pnpm check:attw

  consumer-smoke:
    name: Consumer Smoke
    needs: changes
    if: needs.changes.outputs.full_verification == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024
        with:
          cache: true
          require-lockfile: true
          runtime: node@24.20.0
      - name: Build packages
        run: pnpm build
      - name: Verify packed packages in a clean npm consumer
        shell: bash
        run: |
          consumer_dir="$(mktemp -d)"
          mkdir -p "$consumer_dir/tarballs"

          for package in eslint-config-yarapa prettier-config-yarapa commitlint-config-yarapa; do
            (
              cd "packages/$package"
              pnpm pack --pack-destination "$consumer_dir/tarballs" >/dev/null
            )
          done

          cd "$consumer_dir"
          npm init --yes >/dev/null
          npm install \
            --ignore-scripts \
            --no-audit \
            --no-fund \
            --save-exact \
            eslint@10.11.0 \
            prettier@3.9.9 \
            @commitlint/cli@21.2.3 \
            typescript@6.0.3 \
            ./tarballs/*.tgz

          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import {ESLint} from "eslint";
          import prettier from "prettier";
          import yarapa from "@yarapa/eslint-config-yarapa-imprement-demo";
          import prettierConfig from "@yarapa/prettier-config-yarapa-imprement-demo";
          import commitlintConfig from "@yarapa/commitlint-config-yarapa-imprement-demo";

          const eslint = new ESLint({
            overrideConfigFile: true,
            overrideConfig: yarapa(),
          });
          const [lintResult] = await eslint.lintText("", {filePath: "fixture.js"});
          assert(lintResult);

          const formatted = await prettier.format("const value={a:1}\n", {
            ...prettierConfig,
            parser: "babel",
          });
          assert(formatted.length > 0);

          const shellFormatted = await prettier.format(
            '#!/usr/bin/env sh\nif [ "$value" = "1" ]; then\n\techo yes\nfi\n',
            {
              ...prettierConfig,
              parser: "sh",
            },
          );
          assert(shellFormatted.includes("  echo yes"));

          assert.equal(typeof commitlintConfig, "object");
          NODE

          printf '%s\n' 'chore(test): validate consumer' | \
            npx --no-install commitlint \
              --config node_modules/@yarapa/commitlint-config-yarapa-imprement-demo/dist/index.mjs

  compatibility:
    name: Compatibility (${{ matrix.os }}, Node ${{ matrix.node }}, ESLint ${{ matrix.eslint }})
    needs: changes
    if: needs.changes.outputs.full_verification == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 24.15.0
            eslint: 10.4.0
          - os: ubuntu-latest
            node: 24.21.0
            eslint: 10.11.0
          - os: windows-latest
            node: 24.21.0
            eslint: 10.11.0
          - os: macos-latest
            node: 24.21.0
            eslint: 10.11.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024
        with:
          cache: true
          require-lockfile: true
          runtime: node@${{ matrix.node }}
      - name: Install matrix ESLint
        run: >-
          pnpm --filter @yarapa/eslint-config-yarapa-imprement-demo
          add --save-dev --save-exact
          eslint@${{ matrix.eslint }}
          --lockfile=false
          --ignore-scripts
      - name: Run package tests
        run: >-
          pnpm --config.verify-deps-before-run=false
          --filter @yarapa/eslint-config-yarapa-imprement-demo
          test

  peer-compatibility:
    name: Peer Compatibility (${{ matrix.package }}, ${{ matrix.peer }} ${{ matrix.version }})
    needs: changes
    if: needs.changes.outputs.full_verification == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: eslint-config-yarapa
            peer: eslint
            version: 10.4.0
          - package: prettier-config-yarapa
            peer: prettier
            version: 3.6.0
          - package: commitlint-config-yarapa
            peer: commitlint
            version: 19.0.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024
        with:
          cache: true
          require-lockfile: true
          runtime: node@24.15.0
      - name: Build package
        run: pnpm --filter @yarapa/${{ matrix.package }} build
      - name: Verify lower-bound peer compatibility
        shell: bash
        run: |
          consumer_dir="$(mktemp -d)"
          mkdir -p "$consumer_dir/tarballs"

          (
            cd "packages/${{ matrix.package }}"
            pnpm pack --pack-destination "$consumer_dir/tarballs" >/dev/null
          )

          cd "$consumer_dir"
          npm init --yes >/dev/null

          case "${{ matrix.peer }}" in
            eslint)
              npm install --ignore-scripts --no-audit --no-fund --save-exact \
                eslint@${{ matrix.version }} \
                typescript@6.0.3 \
                ./tarballs/*.tgz

              node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import {ESLint} from "eslint";
          import yarapa from "@yarapa/eslint-config-yarapa-imprement-demo";

          const eslint = new ESLint({
            overrideConfigFile: true,
            overrideConfig: yarapa(),
          });
          const [result] = await eslint.lintText("", {filePath: "fixture.js"});
          assert(result);
          NODE
              ;;
            prettier)
              npm install --ignore-scripts --no-audit --no-fund --save-exact \
                prettier@${{ matrix.version }} \
                ./tarballs/*.tgz

              node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import prettier from "prettier";
          import config from "@yarapa/prettier-config-yarapa-imprement-demo";

          const formatted = await prettier.format(
            '#!/usr/bin/env sh\nif [ "$value" = "1" ]; then\n\techo yes\nfi\n',
            {
              ...config,
              parser: "sh",
            },
          );
          assert(formatted.includes("  echo yes"));
          NODE
              ;;
            commitlint)
              npm install --ignore-scripts --no-audit --no-fund --save-exact \
                @commitlint/cli@${{ matrix.version }} \
                ./tarballs/*.tgz

              printf '%s\n' 'chore(test): validate consumer' | \
                npx --no-install commitlint \
                  --config node_modules/@yarapa/commitlint-config-yarapa-imprement-demo/dist/index.mjs
              ;;
          esac

  ci:
    name: All Checks
    if: always()
    timeout-minutes: 5
    needs:
      - changes
      - actionlint
      - lint
      - format
      - test
      - check-types
      - package-validation
      - consumer-smoke
      - compatibility
      - knip
      - peer-compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Require all verification jobs
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
