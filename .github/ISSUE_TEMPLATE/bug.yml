name: Bug report
description: Report incorrect diagnostics, crashes, compatibility failures, or package-consumption defects.
labels: ["bug", "needs triage"]
assignees:
  - joetakara
  - next-friday-engineer
  - yarapa-engineer
body:
  - type: markdown
    attributes:
      value: |
        Please ensure you are testing against a supported Node.js and ESLint combination.
        Do not include credentials, secrets, personal/customer data, or proprietary source code.
  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight checks
      description: Verify these items before submitting.
      options:
        - label: I searched existing issues and verified this has not been reported yet.
          required: true
        - label: I tested against the latest version of `@yarapa/eslint-config-yarapa-imprement-demo`.
          required: true
  - type: input
    id: version
    attributes:
      label: "@yarapa/eslint-config-yarapa-imprement-demo version"
      placeholder: 0.0.0
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include Node.js, ESLint, OS, package manager, parser, and TypeScript when relevant.
      placeholder: |
        Node.js: 24.20.0
        ESLint: 10.11.0
        OS: Ubuntu 24.04 / macOS
        Package Manager: pnpm 12.6.0
        TypeScript: 6.0.3
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide a minimal public reproduction repo or sanitized code/config demonstrating the defect.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What diagnostic, autofix, or package behavior did you expect?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What diagnostic, crash, autofix, or unexpected behavior occurred?
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety & integrity
      options:
        - label: I confirmed that credentials, secrets, personal/customer data, and proprietary code have been removed from this report.
          required: true
